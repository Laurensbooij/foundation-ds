name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # tokens.css is generated (ADR-0003); a drifted commit means someone
      # hand-edited it or forgot to run `pnpm tokens`.
      - name: Check tokens.css is not drifted
        run: git diff --exit-code -- src/styles/tokens.css
      # Catches a broken exports map or sideEffects field before it is published.
      - run: pnpm verify:package
